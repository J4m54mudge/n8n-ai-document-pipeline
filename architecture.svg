<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#44545c"/></marker>
    <style>
      .box{fill:#ffffff;stroke:#0F3D3E;stroke-width:2;rx:8}
      .gate{fill:#fff4e5;stroke:#b26a00;stroke-width:2.5}
      .ext{fill:#eef4f5;stroke:#7a8c93;stroke-width:1.5;stroke-dasharray:5 4}
      .t{font-size:15px;font-weight:bold;fill:#0F3D3E}
      .s{font-size:12px;fill:#44545c}
      .l{stroke:#44545c;stroke-width:2;fill:none;marker-end:url(#a)}
      .lab{font-size:11px;fill:#44545c}
    </style>
  </defs>
  <rect width="1200" height="520" fill="#f8fafb"/>
  <text x="30" y="38" font-size="22" font-weight="bold" fill="#0F3D3E">AI document pipeline with human approval - n8n</text>
  <text x="30" y="60" font-size="13" fill="#44545c">Nothing reaches the customer automatically. Every outcome (approved / rejected / expired) is logged.</text>

  <!-- triggers -->
  <rect class="box" x="30" y="100" width="170" height="54" rx="8"/><text class="t" x="45" y="123">Form Trigger</text><text class="s" x="45" y="142">/form/intake</text>
  <rect class="box" x="30" y="170" width="170" height="54" rx="8"/><text class="t" x="45" y="193">Webhook</text><text class="s" x="45" y="212">inbound email / API</text>
  <rect class="box" x="30" y="240" width="170" height="54" rx="8" stroke-dasharray="4 3"/><text class="t" x="45" y="263">IMAP (optional)</text><text class="s" x="45" y="282">poll a mailbox</text>

  <rect class="box" x="240" y="170" width="160" height="54" rx="8"/><text class="t" x="255" y="193">Normalise + Config</text><text class="s" x="255" y="212">fail closed if empty</text>
  <path class="l" d="M200 127 C220 127 220 197 238 197"/><path class="l" d="M200 197 L238 197"/><path class="l" d="M200 267 C220 267 220 197 238 197"/>

  <rect class="box" x="440" y="150" width="180" height="94" rx="8"/><text class="t" x="455" y="174">Claude (HTTP node)</text><text class="s" x="455" y="194">extract fields, priority +</text><text class="s" x="455" y="210">reason, missing info,</text><text class="s" x="455" y="226">draft reply (JSON)</text>
  <path class="l" d="M400 197 L438 197"/>
  <rect class="ext" x="440" y="270" width="180" height="40" rx="6"/><text class="s" x="452" y="295">mock mode: offline test node</text>

  <rect class="box" x="660" y="150" width="170" height="94" rx="8"/><text class="t" x="675" y="174">Parse + validate</text><text class="s" x="675" y="194">bad JSON / low confidence</text><text class="s" x="675" y="210">-> flagged REVIEW,</text><text class="s" x="675" y="226">never guessed</text>
  <path class="l" d="M620 197 L658 197"/>

  <rect class="gate" x="870" y="130" width="300" height="134" rx="10"/>
  <text class="t" x="888" y="156" fill="#7a4a00">HUMAN APPROVAL GATE</text>
  <text class="s" x="888" y="178">1. Approver gets Slack/email message with</text>
  <text class="s" x="888" y="194">   draft + APPROVE / REJECT links</text>
  <text class="s" x="888" y="214">2. Wait node pauses the execution (no compute)</text>
  <text class="s" x="888" y="234">3. Link click resumes it; 72 h timeout -> EXPIRED</text>
  <text class="s" x="888" y="254">   submission id checked on resume</text>
  <path class="l" d="M830 197 L868 197"/>

  <!-- approve path -->
  <rect class="box" x="870" y="320" width="300" height="70" rx="8"/><text class="t" x="888" y="345">Approved: branded PDF</text><text class="s" x="888" y="366">HTML template -> Gotenberg -> save / Drive</text>
  <path class="l" d="M1020 264 L1020 318"/><text class="lab" x="1028" y="296">approve</text>

  <rect class="box" x="520" y="400" width="300" height="70" rx="8"/><text class="t" x="538" y="425">Log every outcome</text><text class="s" x="538" y="446">Google Sheets append (or Airtable / webhook)</text>
  <path class="l" d="M870 360 C845 360 845 435 822 435"/>
  <path class="l" d="M900 264 C900 300 760 330 700 398"/><text class="lab" x="745" y="330">reject / expired</text>

  <rect class="ext" x="30" y="400" width="440" height="90" rx="8"/>
  <text class="t" x="45" y="424">Credentials (placeholders in the export)</text>
  <text class="s" x="45" y="445">Anthropic: Header Auth (x-api-key) - Google Sheets: OAuth2 - IMAP</text>
  <text class="s" x="45" y="464">Endpoints via env vars: APPROVAL_WEBHOOK_URL, GOTENBERG_URL,</text>
  <text class="s" x="45" y="481">LOG_TARGET, LOG_SHEET_ID, PIPELINE_LLM_MODE (live | mock)</text>
</svg>
